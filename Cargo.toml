[workspace]
resolver = "3"
members = ["crates/ledger", "crates/runtime", "crates/control-plane"]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.98"
edition = "2024"
repository = "https://github.com/hbjydev/switchboard"
publish = false

[package]
name = "switchboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ledger.workspace = true
runtime.workspace = true
control-plane.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
reqwest.workspace = true
serde.workspace = true
tracing.workspace = true
uuid.workspace = true
axum.workspace = true
base64.workspace = true
sha2.workspace = true
subtle.workspace = true
jsonwebtoken.workspace = true
url.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
testcontainers-modules.workspace = true
sqlx.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_glob_reexports = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

string_slice = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"

let_underscore_future = "warn"
let_underscore_must_use = "allow"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
unused_async_trait_impl = "allow"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
ledger = { path = "crates/ledger" }
runtime = { path = "crates/runtime" }
control-plane = { path = "crates/control-plane" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
subtle = "2.6"
jsonwebtoken = "9.3"
base64 = "0.22"
sha2 = "0.10"
url = "2.5"
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util", "sync", "net"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
