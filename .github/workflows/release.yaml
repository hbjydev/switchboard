---
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      rust-version: ${{ steps.versions.outputs.rust-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          experimental: true
          install: false

      - name: Resolve versions
        id: versions
        run: |
          echo "rust-version=$(mise tool rust --active)" >> "$GITHUB_OUTPUT"

  rust-build:
    name: Build release binaries
    runs-on: ${{ matrix.runs }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runs: ubuntu-26.04
          - os: linux
            arch: aarch64
            runs: ubuntu-26.04-arm
          - os: macos
            arch: aarch64
            runs: macos-26
          - os: windows
            arch: amd64
            runs: windows-2025
          - os: windows
            arch: aarch64
            runs: windows-11-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-repo
      - shell: bash
        run: mise run build-release
      - name: Prepare release binary
        id: release-bin-name
        shell: bash
        env:
          ASSET_NAME: switchboard-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          if [[ "${{ matrix.os }}" = "windows" ]]; then
            bin_name=switchboard.exe
            asset_name="${ASSET_NAME}.exe"
          else
            bin_name=switchboard
            asset_name="${ASSET_NAME}"
          fi
          mkdir -p dist
          cp "target/release/${bin_name}" "dist/${asset_name}"
          echo "asset_path=dist/${asset_name}" >> "${GITHUB_OUTPUT}"
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ steps.release-bin-name.outputs.asset_path }}
      - shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ASSET_PATH: ${{ steps.release-bin-name.outputs.asset_path }}
        run: cp "$BUNDLE_PATH" "${ASSET_PATH}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switchboard-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PATH: ${{ steps.release-bin-name.outputs.asset_path }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" "${ASSET_PATH}.sigstore.json" --clobber

  release:
    name: Release
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
      cache: true
      file: Dockerfile
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
