[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Unlicense"]
# Required by the Rustls HTTPS adapter; keep allowances scoped to its dependencies.
exceptions = [
  { name = "ring", allow = ["ISC"] },
  { name = "rustls-webpki", allow = ["ISC"] },
  { name = "untrusted", allow = ["ISC"] },
  { name = "subtle", allow = ["BSD-3-Clause"] },
  { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []

# Use rustls for TLS. Permit OpenSSL only for WebAuthn attestation, where
# webauthn-rs-core requires it unconditionally.
deny = [{ crate = "openssl-sys" }, { crate = "native-tls" }]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
