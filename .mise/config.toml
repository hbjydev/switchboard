[settings.cargo]
binstall = true
binstall_native = true

[env]
_.file = ".env"
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[tools]
rust = "1.98.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:crate-ci/typos" = "1.50.2"

[tasks.rust-components]
description = "Install Rust components required by project tasks"
run = "rustup component add rustfmt clippy"

[tasks.build]
description = "Build all of the components of the workspace"
run = "cargo build --workspace --all-targets --all-features --locked"

[tasks.build-release]
description = "Build all of the released binaries of the workspace"
run = "cargo build --workspace --release --locked --bin switchboard"

[tasks.complexity]
description = "Report every function above the cognitive-complexity threshold (clippy.toml; advisory)"
run = '''
set -eu
echo "==> functions above the cognitive-complexity threshold (see clippy.toml)"
cargo clippy --workspace --all-targets --all-features --locked -q -- -W clippy::cognitive_complexity 2>&1 \
  | grep -A2 'cognitive complexity of' \
  | grep -E 'cognitive complexity of|-->' \
  || echo "none — everything is under the threshold"
'''

[tasks.complexity-check]
description = "Ratchet gate: fail if the count of over-threshold functions grows"
run = '''
set -eu
# RATCHET: the count of functions above the cognitive-complexity threshold
# (clippy.toml, 25) must never GROW. This is a count budget with an
# aspirational per-function threshold — not a permissive threshold sized to
# the worst offender — so a NEW overly-complex function fails immediately
# even while the legacy offenders are still being paid down. Refactored one
# under the threshold? Lower BUDGET to match (the task reminds you).
BUDGET=0
REPORT=$(mktemp)
trap 'rm -f "$REPORT"' EXIT
if ! cargo clippy --workspace --all-targets --all-features --locked -q -- -W clippy::cognitive_complexity >"$REPORT" 2>&1; then
  cat "$REPORT"
  exit 1
fi
COUNT=$(grep -c 'cognitive complexity of' "$REPORT" || true)
echo "==> functions above the cognitive-complexity threshold: $COUNT (budget: $BUDGET)"
if [ "$COUNT" -gt "$BUDGET" ]; then
  echo "error: cognitive-complexity offenders grew ($COUNT > $BUDGET)." >&2
  echo "Run 'mise run complexity' to list them; simplify the new function (extract" >&2
  echo "pure, unit-testable helpers — the repo idiom) instead of raising BUDGET." >&2
  exit 1
fi
if [ "$COUNT" -lt "$BUDGET" ]; then
  echo "note: offenders dropped below the budget — ratchet BUDGET down to $COUNT in .mise/config.toml"
fi
'''

[tasks.fmt]
description = "Run rustfmt on the entire workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Run rustfmt on the entire workspace in check mode"
run = "mise run fmt -- --check"

[tasks.check]
description = "Run all CI checks locally"
depends = ["lint", "test", "test-int", "doc", "audit"]

[tasks.clippy]
description = "Lint the Rust workspace"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.lint]
description = "Run fmt-check, clippy"
depends = ["fmt-check", "clippy"]

[tasks.test]
description = "Run unit tests with nextest"
run = '''
cargo nextest run \
    --workspace \
    --all-features \
    --no-fail-fast \
    --locked \
    -E 'not binary(/^integration/)'
'''

[tasks.test-int]
description = "Run PostgreSQL integration tests (requires a disposable DATABASE_URL)"
run = '''
cargo nextest run \
    --workspace \
    --all-features \
    --no-fail-fast \
    --locked \
    -E 'binary(/^integration/)'
'''

[tasks.test-archive]
description = "Build the workspace ONCE (--all-features) and pack its tests for nextest"
run = '''
set -eu
mkdir -p target/nextest
cargo nextest archive --workspace --all-features --locked \
    --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst"
'''

[tasks.test-from-archive]
description = "Run tests from the pre-built archive `test-archive` built"
run = '''
cargo-nextest nextest run --profile ci --workspace-remap . \
    --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst" \
    -E 'not binary(/^integration/)'
'''

[tasks.test-int-from-archive]
description = "Run integration tests from the pre-built archive `test-archive` built"
run = '''
cargo-nextest nextest run --profile ci --workspace-remap . \
    --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst" \
    -E 'binary(/^integration/)'
'''

[tasks.audit]
description = "Run cargo-deny checks"
run = "cargo deny --all-features check"

[tasks.doc]
description = "Build docs with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps"

[tasks.build-docker]
description = "Build Docker image for the Ledger CLI and worker"
env = { RUST_VERSION = { tools = true, value = "{{ tools.rust.version }}" } }
usage = """
flag "--tag <tag>" help="The tag to build the docker image with" default="dev"
flag "--repo <repo>" help="The Docker repo to build the docker image with" default="ghcr.io/hbjydev/switchboard"
"""
run = """
docker build . \
  --build-arg RUST_VERSION=${RUST_VERSION} \
  --file Dockerfile \
  --tag "${usage_repo}:${usage_tag}" \
"""
